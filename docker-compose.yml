# =============================================================================
# NEXUS AUCTION SERVICE - DOCKER COMPOSE
# =============================================================================
# Chạy độc lập service này. Database dùng Neon Cloud, hạ tầng dùng chung nexus-network.
# Lệnh: docker compose up -d --build
# =============================================================================

name: nexus-auction

services:
  auction-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-auction-service
    ports:
      - "${AUCTION_SERVICE_PORT:-8005}:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "${AUCTION_DB_CONNECTION:?AUCTION_DB_CONNECTION is required}"
      InternalSecurity__ServiceKey: "${INTERNAL_SERVICE_SECRET:-eaT0Ombups70WJzd85CBBpp8rAno55SxKn1qvYBGH9e}"
      Catalog__BaseUrl: "${CATALOG_SERVICE_URL:-http://catalog-service:8002}"
      User__BaseUrl: "${USER_SERVICE_URL:-${USERS_SERVICE_URL:-http://user-service:8001}}"
      Wallet__BaseUrl: "${WALLET_SERVICE_URL:-http://wallet-service:8008}"
      Commerce__Enabled: "${COMMERCE_ENABLED:-true}"
      Commerce__BaseUrl: "${COMMERCE_SERVICE_URL:-http://commerce-service:8003}"
      Notification__Enabled: "${NOTIFICATION_ENABLED:-true}"
      Notification__BaseUrl: "${NOTIFICATION_BASE_URL:-${GATEWAY_URL:-http://notification-service:8007}}"
      Deposit__CallbackBaseUrl: "${DEPOSIT_CALLBACK_BASE_URL:-http://auction-service:8005}"
      Deposit__AllowedReturnUrlHosts__0: "${DEPOSIT_ALLOWED_RETURN_URL_HOST_0:-localhost}"
      AdminTimeControls__Enabled: "${ADMIN_TIME_CONTROLS_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true