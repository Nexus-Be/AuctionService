# =============================================================================
# NEXUS AUCTION SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Auction Service:
#   CSDL chính lưu trên Neon Cloud (PostgreSQL)
#   docker compose up -d
# =============================================================================

services:

  # 1. Ứng dụng Auction Service RESTful Web API (Port 8005)
  auction-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-auction-service
    ports:
      - "${AUCTION_SERVICE_PORT:-8005}:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${AUCTION_CONNECTION_STRING:-${CONNECTION_STRING}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
